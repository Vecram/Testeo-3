<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Portafolio</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>

    <!-- Sección Sobre Mí -->
    <section id="sobre-mi" class="container py-5">
        <div class="row align-items-center">

            <!-- Columna izquierda: imagen -->
            <div class="col-md-6 text-center mb-4 mb-md-0">
                <img
                    src="https://placehold.co/300x300"
                    alt="Foto de perfil"
                    class="img-fluid rounded-circle"
                    width="300"
                    height="300"
                >
            </div>

            <!-- Columna derecha: descripción -->
            <div class="col-md-6">
                <h2>Sobre Mí</h2>

                <p>
                    ¡Hola! Soy una persona apasionada por la tecnología
                    y el desarrollo web. Me gusta aprender nuevas
                    herramientas, crear proyectos y desarrollar
                    soluciones creativas.
                </p>
            </div>

        </div>
    </section>

</body>
</html>
